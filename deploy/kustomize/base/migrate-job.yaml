# Runs once per apply: wait for Postgres, create/upgrade the schema, exit.
apiVersion: batch/v1
kind: Job
metadata:
  name: deepscan-migrate
  labels: { app.kubernetes.io/name: migrate }
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: deepscan
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: kubeek-sec/deepscan:latest
          command: ["deepscan-kruncher", "db", "init"]
          envFrom:
            - configMapRef: { name: deepscan-config }
            - secretRef: { name: deepscan-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
