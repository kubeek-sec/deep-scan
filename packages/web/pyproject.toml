[project]
name = "deepscan-web"
version = "0.1.0"
description = "Deep Scan web app - static frontend served by the REST API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscan_web"]
# Static assets live under the package dir, so `packages` already ships them.
# (A force-include of the same files would duplicate them in the wheel and
# break `uv sync --no-editable` / wheel builds.)
