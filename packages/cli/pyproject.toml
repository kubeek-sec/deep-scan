[project]
name = "deepscan-cli"
version = "0.1.0"
description = "Deep Scan CLI - run scans locally and in CI, manage scanner tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepscan-core",
]

[project.scripts]
deepscan = "deepscan_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscan_cli"]

[tool.uv.sources]
deepscan-core = { workspace = true }
