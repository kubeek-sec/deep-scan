[project]
name = "deepscan-jobs"
version = "0.1.0"
description = "Deep Scan shared job store: a Postgres-backed scan-job queue and runner reused by the API, MCP server and kruncher"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepscan-core",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscan_jobs"]

[tool.uv.sources]
deepscan-core = { workspace = true }
