[project]
name = "deepscan-graphoofy"
version = "0.1.0"
description = "Vendored AST + code-graph pipeline from graphoofy (code-only, no AI/documents): tree-sitter extraction, NetworkX graph build, clustering and analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.4",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-bash>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphoofy"]
