[project]
name = "deepscan-input-connector-github"
version = "0.1.0"
description = "Deep Scan input connector for GitHub: discover repositories under an organization or user"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepscan-input-connector-base",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscan_input_connector_github"]

[tool.uv.sources]
deepscan-input-connector-base = { workspace = true }
