[project]
name = "deepscan-input-connector-git"
version = "0.1.0"
description = "Deep Scan input connector for direct git URL(s): scan a repository without enumerating an org/group"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepscan-input-connector-base",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscan_input_connector_git"]

[tool.uv.sources]
deepscan-input-connector-base = { workspace = true }
