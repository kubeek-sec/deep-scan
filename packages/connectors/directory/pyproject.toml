[project]
name = "deepscan-input-connector-directory"
version = "0.1.0"
description = "Deep Scan input connector for a server-accessible directory (any contents, not only git)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepscan-input-connector-base",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscan_input_connector_directory"]

[tool.uv.sources]
deepscan-input-connector-base = { workspace = true }
