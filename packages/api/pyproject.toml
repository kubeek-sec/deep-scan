[project]
name = "deepscan-api"
version = "0.1.0"
description = "Deep Scan REST API - multi-scan job queue over the scanner library, serves the web app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepscan-core",
    "deepscan-jobs",
    "deepscan-web",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
]

[project.scripts]
deepscan-api = "deepscan_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscan_api"]

[tool.uv.sources]
deepscan-core = { workspace = true }
deepscan-jobs = { workspace = true }
deepscan-web = { workspace = true }
