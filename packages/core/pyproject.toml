[project]
name = "deepscan-core"
version = "0.1.0"
description = "Deep Scan core library: scanner registry, secure tool installation, normalized findings and report rendering"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepscan-graphoofy",
    "fpdf2>=2.7",
    "sentry-sdk>=2.0",
    "yara-python>=4.5.4",
]

[tool.uv.sources]
deepscan-graphoofy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscan_core"]

# ``data/`` is git-ignored at the repo root (runtime scan output), which would
# otherwise exclude the *packaged* default rule sets (YARA, mcp-threats, …) from
# the wheel. Force-include them so installed deployments ship the defaults.
[tool.hatch.build]
artifacts = ["src/deepscan_core/data/**"]
